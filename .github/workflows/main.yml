name: Weekly sitemap check

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays at 06:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare sitemaps
        run: python monitor.py

      # Runs even if one sitemap failed, so the others are still saved.
      - name: Save results
        if: always()
        run: |
          git config user.name "sitemap-watch"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots docs
          git diff --cached --quiet || git commit -m "Sitemap check $(date -u +%F)"
          git push
